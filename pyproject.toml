[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-sd-lab"
version = "0.2.0"
description = "从零训练的 PyTorch 轻量图像和视频潜扩散教学项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "Pillow>=10,<13", "opencv-python-headless>=4.8,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["mini_sd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
